name: bh_finder
description: "A boarding-house discovery and management platform built with Flutter and Supabase."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  provider: ^6.1.2
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.16.0

  # Current Location
  geolocator: ^14.0.2

  # Reverse Geocoding
  geocoding: ^4.0.0

  # Location Permission
  permission_handler:
    ^12.0.1

    # Image Picker
  image_picker: ^1.2.0

  # Date Formatting
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/inter/Inter_18pt-Regular.ttf
        - asset: assets/fonts/inter/Inter_18pt-Medium.ttf
          weight: 500
        - asset: assets/fonts/inter/Inter_18pt-Bold.ttf
          weight: 700
